<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script src="maintenance-check.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance | Y8X</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- MAIN -->
    <main>
        <section style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--spacing-3xl) var(--spacing-2xl); text-align: center; background: linear-gradient(135deg, rgba(124, 58, 237, 0.05) 0%, rgba(236, 72, 153, 0.05) 100%);">
            <div style="max-width: 600px;">
                <div style="font-size: 5rem; margin-bottom: var(--spacing-lg);">🔧</div>

                <h1 style="font-size: 2.5rem; font-weight: 800; color: var(--text-primary); margin-bottom: var(--spacing-md);">
                    We're Under Maintenance
                </h1>

                <p style="font-size: 1.1rem; color: var(--text-secondary); margin-bottom: var(--spacing-xl); line-height: 1.6;">
                    We're currently working on improvements to make Y8X even better. We'll be back online shortly!
                </p>

                <div style="display: flex; flex-direction: column; gap: var(--spacing-lg); align-items: center;">
                    <div style="display: flex; gap: var(--spacing-lg); justify-content: center; flex-wrap: wrap;">
                        <div style="text-align: center;">
                            <div style="font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: var(--spacing-sm);" id="countdownHours">--</div>
                            <div style="color: var(--text-secondary); font-size: 0.9rem;">Hours</div>
                        </div>
                        <div style="color: var(--text-muted); font-size: 2rem;">:</div>
                        <div style="text-align: center;">
                            <div style="font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: var(--spacing-sm);" id="countdownMinutes">--</div>
                            <div style="color: var(--text-secondary); font-size: 0.9rem;">Minutes</div>
                        </div>
                        <div style="color: var(--text-muted); font-size: 2rem;">:</div>
                        <div style="text-align: center;">
                            <div style="font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: var(--spacing-sm);" id="countdownSeconds">--</div>
                            <div style="color: var(--text-secondary); font-size: 0.9rem;">Seconds</div>
                        </div>
                    </div>
                </div>

                <div style="margin-top: var(--spacing-3xl); padding: var(--spacing-xl); background: white; border: 1px solid var(--border); border-radius: var(--radius-2xl);">
                    <h3 style="color: var(--text-primary); font-weight: 600; margin-bottom: var(--spacing-md);">Stay Updated</h3>
                    <p style="color: var(--text-secondary); margin-bottom: var(--spacing-lg);">Join our Discord to get notified when we're back online</p>
                    <a href="https://discord.gg/nYK36E5D2X" target="_blank" rel="noopener" class="hero-btn hero-btn-primary" style="width: 100%;">
                        Join Discord
                    </a>
                </div>
            </div>
        </section>
    </main>

    <script>
        function updateCountdown() {
            // Get maintenance end time from session storage or calculate it
            let endTime = localStorage.getItem('maintenanceEndTime');
            
            if (!endTime) {
                // Set to 2 hours from now if not set
                const now = new Date();
                const maintenance = new Date(now.getTime() + 2 * 60 * 60 * 1000);
                endTime = maintenance.getTime();
                localStorage.setItem('maintenanceEndTime', endTime);
            }

            const now = new Date().getTime();
            const remaining = Math.max(0, endTime - now);

            const hours = Math.floor((remaining % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((remaining % (1000 * 60)) / 1000);

            document.getElementById('countdownHours').textContent = String(hours).padStart(2, '0');
            document.getElementById('countdownMinutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('countdownSeconds').textContent = String(seconds).padStart(2, '0');

            if (remaining > 0) {
                setTimeout(updateCountdown, 1000);
            }
        }

        updateCountdown();
    </script>
    <script src="protect.js"></script>
</body>

</html>
