<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script src="maintenance-check.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Y8X</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- HEADER -->
    <header class="site-header">
        <a href="index.html" class="header-logo">Y8X</a>
        <div class="header-right">
            <a href="index.html" class="hero-btn hero-btn-primary" style="padding: 8px 16px; font-size: 0.9rem;">
                Back Home
            </a>
        </div>
    </header>

    <!-- MAIN -->
    <main>
        <section style="min-height: calc(100vh - var(--header-height)); display: flex; align-items: center; justify-content: center; padding: var(--spacing-3xl) var(--spacing-2xl); text-align: center;">
            <div style="max-width: 600px;">
                <div style="font-size: 8rem; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: var(--spacing-lg); line-height: 1;">
                    404
                </div>

                <h1 style="font-size: 2.5rem; font-weight: 800; color: var(--text-primary); margin-bottom: var(--spacing-md);">
                    Page Not Found
                </h1>

                <p style="font-size: 1.1rem; color: var(--text-secondary); margin-bottom: var(--spacing-2xl); line-height: 1.6;">
                    Sorry, the page you're looking for doesn't exist. It might have been removed or the URL might be incorrect.
                </p>

                <div style="display: flex; gap: var(--spacing-lg); justify-content: center; flex-wrap: wrap;">
                    <a href="index.html" class="hero-btn hero-btn-primary">
                        ← Back to Home
                    </a>
                    <a href="cheat.html" class="hero-btn hero-btn-secondary">
                        Browse Cheats →
                    </a>
                </div>

                <div style="margin-top: var(--spacing-3xl); padding: var(--spacing-xl); background: var(--bg-alt); border: 1px solid var(--border); border-radius: var(--radius-2xl);">
                    <h3 style="color: var(--text-primary); font-weight: 600; margin-bottom: var(--spacing-md);">Need Help?</h3>
                    <p style="color: var(--text-secondary); margin-bottom: var(--spacing-lg);">Join our Discord community to get support or report this issue.</p>
                    <a href="https://discord.gg/nYK36E5D2X" target="_blank" rel="noopener" class="hero-btn hero-btn-primary" style="width: 100%;">
                        Join Discord
                    </a>
                </div>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="container">
            <div style="text-align: center; color: white; opacity: 0.7; font-size: 0.9rem;">
                <p>© 2026 Y8X. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="protect.js"></script>
</body>

</html>
